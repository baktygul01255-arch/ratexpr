<title>Иррациональные выражения</title>
<script id="glyph-fix">
/* glyph-fix: на интерактивных досках без нужных шрифтов символы ⁰¹²…⁻, ₀₁₂…, ∛ показываются квадратиками.
   Заменяем их обычной разметкой <sup>/<sub> (в SVG — tspan со сдвигом, на canvas — рисуем уменьшенным шрифтом). */
(function(){
  const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺⁼⁽⁾ⁿⁱˣʸʳˢᐟ',SUPV='0123456789−+=()nixyrs/';
  const SUB='₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓ',SUBV='0123456789+−=()aeox';
  const RX=/([⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺⁼⁽⁾ⁿⁱˣʸʳˢᐟ]+)|([₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓ]+)|([∛∜])/g;
  const TEST=/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺⁼⁽⁾ⁿⁱˣʸʳˢᐟ₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓ∛∜]/;
  const conv=(s,A,B)=>s.split('').map(c=>{const i=A.indexOf(c);return i<0?c:B[i];}).join('');
  const plain=s=>conv(conv(s,SUP,SUPV),SUB,SUBV).replace(/∛/g,'3√').replace(/∜/g,'4√');
  function segs(s){const r=[];let last=0;s.replace(RX,(m,a,b,c,off)=>{if(off>last)r.push({t:s.slice(last,off),k:''});
      if(a)r.push({t:conv(a,SUP,SUPV),k:'sup'});else if(b)r.push({t:conv(b,SUB,SUBV),k:'sub'});else{r.push({t:c==='∛'?'3':'4',k:'sup'});r.push({t:'√',k:''});}
      last=off+m.length;return m;});if(last<s.length)r.push({t:s.slice(last),k:''});return r;}
  const SVGNS='http://www.w3.org/2000/svg',SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,OPTION:1,TITLE:1,title:1,NOSCRIPT:1};
  function fixText(t){const s=t.nodeValue;if(!s||!TEST.test(s))return;const p=t.parentNode;if(!p||SKIP[p.nodeName])return;
    const svg=p.namespaceURI===SVGNS;
    if(!svg&&(p.nodeName==='SUP'||p.nodeName==='SUB')){t.nodeValue=plain(s);return;}
    const f=document.createDocumentFragment();
    segs(s).forEach(g=>{if(!g.k){f.appendChild(document.createTextNode(g.t));return;}
      let e;if(svg){e=document.createElementNS(SVGNS,'tspan');e.setAttribute('baseline-shift',g.k==='sup'?'super':'sub');e.setAttribute('font-size','72%');}
      else e=document.createElement(g.k);
      e.textContent=g.t;f.appendChild(e);});
    p.replaceChild(f,t);}
  function walk(n){if(!n)return;if(n.nodeType===3){fixText(n);return;}if(n.nodeType!==1||SKIP[n.nodeName])return;
    const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),a=[];let x;while((x=w.nextNode()))if(TEST.test(x.nodeValue))a.push(x);a.forEach(fixText);}
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')fixText(m.target);else m.addedNodes.forEach(walk);}})
    .observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  document.addEventListener('DOMContentLoaded',()=>walk(document.body));
  /* canvas */
  const CP=CanvasRenderingContext2D.prototype,oF=CP.fillText,oS=CP.strokeText,oM=CP.measureText;
  function layout(ctx,s){const f=ctx.font,m=f.match(/(\d+(?:\.\d+)?)px/),fs=m?+m[1]:16,sm=m?f.replace(m[0],(fs*.7).toFixed(1)+'px'):f;
    const g=segs(s);let tot=0;g.forEach(q=>{ctx.font=q.k?sm:f;q.w=oM.call(ctx,q.t).width;tot+=q.w;});ctx.font=f;return{g,tot,f,sm,fs};}
  function draw(orig,ctx,s,x,y,mw){s=String(s);if(!TEST.test(s))return mw===undefined?orig.call(ctx,s,x,y):orig.call(ctx,s,x,y,mw);
    const Lo=layout(ctx,s);const al=ctx.textAlign,rtl=ctx.direction==='rtl';let x0=x;
    if(al==='center')x0=x-Lo.tot/2;else if(al==='right'||(al==='end'&&!rtl)||(al==='start'&&rtl))x0=x-Lo.tot;
    ctx.save();ctx.textAlign='left';Lo.g.forEach(q=>{ctx.font=q.k?Lo.sm:Lo.f;orig.call(ctx,q.t,x0,y+(q.k==='sup'?-Lo.fs*.36:q.k==='sub'?Lo.fs*.22:0));x0+=q.w;});ctx.restore();}
  CP.fillText=function(s,x,y,mw){return draw(oF,this,s,x,y,mw);};
  CP.strokeText=function(s,x,y,mw){return draw(oS,this,s,x,y,mw);};
  CP.measureText=function(s){s=String(s);const r=oM.call(this,s);if(!TEST.test(s))return r;const Lo=layout(this,s);
    return{width:Lo.tot,actualBoundingBoxLeft:r.actualBoundingBoxLeft,actualBoundingBoxRight:Lo.tot,actualBoundingBoxAscent:r.actualBoundingBoxAscent,actualBoundingBoxDescent:r.actualBoundingBoxDescent,fontBoundingBoxAscent:r.fontBoundingBoxAscent,fontBoundingBoxDescent:r.fontBoundingBoxDescent};};
})();
</script>

<script>

/* ================= база ================= */
let LANG='ru';
try{const s=localStorage.getItem('rtx-lang');if(s==='kz'||s==='ru')LANG=s;}catch(e){}
const L=(ru,kz)=>LANG==='kz'?kz:ru;
const $=s=>document.querySelector(s);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const newSeed=()=>Math.floor(Math.random()*2**31);
function withSeed(seed,fn){const p=rnd;rnd=mulberry(seed);try{return fn();}finally{rnd=p;}}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const Q=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);return[n/g,d/g];};
const frac=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const M_=s=>`<span class="m">${s}</span>`;
const strip=h=>h.replace(/<[^>]+>/g,'|');
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(parent,s,x,y,a){const e=el('text',Object.assign({x,y,'font-size':19,fill:'var(--ink)','font-family':'PT Serif, Georgia, serif','paint-order':'stroke',stroke:'var(--surface)','stroke-width':5,'stroke-linejoin':'round'},a||{}),parent);e.textContent=s;return e;}
function trimN(x,d){let s=x.toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s;}
function fmt(x,sig=4){if(!isFinite(x))return'—';if(Math.abs(x)<1e-12)return'0';const a=Math.abs(x);const d=Math.max(0,sig-1-Math.floor(Math.log10(a)));return trimN(x,Math.min(d,8)).replace('.',',').replace('-','−');}
const neg=s=>String(s).replace(/^-/,'−');
/* ---------- запись корней и степеней ---------- */
const ov=s=>`<span class="ov">${s}</span>`;
function rad(n,x){return n===2?`<span class="rt">√${ov(x)}</span>`:`<span class="rt"><sup class="ri">${n}</sup>√${ov(x)}</span>`;}
const pw=(b,e)=>`${b}<sup>${e}</sup>`;
const rH=r=>{const[p,q]=Q(r[0],r[1]);return q===1?neg(p):(p<0?'−':'')+frac(Math.abs(p),q);};
const rS=r=>{const[p,q]=Q(r[0],r[1]);return q===1?neg(p):neg(p)+'/'+q;}; // для показателя
const rV=r=>r[0]/r[1];
function decH(x){return fmt(x,6);}
// упрощение ⁿ√A (A>0, целое): {c,r}
function simp(n,A){let c=1,r=A;for(let t=Math.floor(Math.pow(A,1/n)+1e-9);t>=2;t--){const tn=Math.pow(t,n);if(r%tn===0){c*=t;r/=tn;t=Math.floor(Math.pow(r,1/n)+1e-9)+1;}}return{c,r};}
function cRad(c,n,r){if(r===1)return neg(c);const R=rad(n,r);return c===1?R:c===-1?'−'+R:neg(c)+R;}
const isPow=(A,n)=>{const t=Math.round(Math.pow(Math.abs(A),1/n));return Math.pow(t,n)===Math.abs(A);};

/* ---------- степени с рациональным показателем, многочлены ---------- */
const xf=(m,n)=>`<span class="xf"><span>${m}</span><span>${n}</span></span>`;
const E=(b,m,n=1)=>n===1?(m===1?String(b):`${b}<sup>${neg(m)}</sup>`):`${b}${xf(neg(m),n)}`;
const H=v=>E(v,1,2),Q4=v=>E(v,1,4),C3=v=>E(v,1,3),C23=v=>E(v,2,3),Q34=v=>E(v,3,4);
const cond=s=>` <span class="cond">(${s})</span>`;
const ka=(c,u)=>{const a=Math.abs(c);return u===''?String(a):(a===1?u:a+(/^[\d(]/.test(u)?'·':'')+u);};
function polyH(terms){terms=terms.filter(t=>t[0]!==0);if(!terms.length)return'0';terms=terms.slice();
  const i=terms.findIndex(t=>t[0]>0);if(terms[0][0]<0&&i>0){const t=terms.splice(i,1)[0];terms.unshift(t);}
  return terms.map(([c,u],k)=>(k===0?(c<0?'−':''):(c<0?' − ':' + '))+ka(c,u)).join('');}
function radT(n,A){const s=simp(n,A);return{c:s.c,u:s.r===1?'':rad(n,s.r)};}
function merge(terms){const m=[];terms.forEach(([c,u])=>{const f=m.find(x=>x[1]===u);if(f)f[0]+=c;else m.push([c,u]);});return m.filter(t=>t[0]!==0);}
function fracPoly(terms,d){terms=merge(terms);if(d<0){d=-d;terms=terms.map(([c,u])=>[-c,u]);}let g=d;terms.forEach(([c])=>{g=gcd(g,c);});
  terms=terms.map(([c,u])=>[c/g,u]);d=d/g;const num=polyH(terms);return d===1?num:frac(num,d);}
const cr=(c,C)=>c===1?rad(2,C):c+rad(2,C); // c√C
const sq=x=>x*x;

/* ================= интерфейс ================= */
const UI=()=>({
  eyebrow:L('Алгебра и начала анализа · 11 класс · §6–7 · Тема 10','Алгебра және анализ бастамалары · 11-сынып · §6–7 · 10-тақырып'),
  h1:L('Преобразование выражений, содержащих <em>степень с рациональным показателем</em>. Преобразование иррациональных выражений','<em>Рационал көрсеткішті дәрежесі</em> бар өрнектерді түрлендіру. Иррационал өрнектерді түрлендіру'),
  lead:L('Формулы сокращённого умножения для степеней с дробным показателем, сокращение дробей и разложение на множители, сравнение степеней, действия с корнями, корень из выражения A ± B√C, освобождение от иррациональности в знаменателе — с рисунками, моделями, решателем с самопроверкой, тренажёром и тестом.','Бөлшек көрсеткішті дәрежелер үшін қысқаша көбейту формулалары, бөлшекті қысқарту және көбейткіштерге жіктеу, дәрежелерді салыстыру, түбірлермен амалдар, A ± B√C өрнегінен түбір, бөлімдегі иррационалдықтан босату — суреттермен, модельдермен, өзін-өзі тексеретін шешушімен, жаттықтырғышпен және тестпен.'),
  light:L('Светлая','Ашық'),dark:L('Тёмная','Қараңғы'),
  tTheory:L('Теория','Теория'),tModel:L('Модели','Модельдер'),tSolve:L('Решатель','Шешуші'),tTrain:L('Тренажёр','Жаттықтырғыш'),tTest:L('Тест','Тест'),
  genL:L('Тип задания','Тапсырма түрі'),genHint:L('Нажмите на тип — появится новое задание. Решение скрыто: сначала решите сами в поле ниже, затем выберите ответ; подсказки открываются по одному шагу.','Түрін басыңыз — жаңа тапсырма пайда болады. Шешім жасырын: алдымен төмендегі өрісте өзіңіз шешіп, жауапты таңдаңыз; кеңестер бір қадамнан ашылады.'),
  sAllL:L('Показывать решение сразу (режим учителя)','Шешімді бірден көрсету (мұғалім режимі)'),
  sDone:L('Решено','Шешілді'),sOk:L('Верно','Дұрыс'),sStreak:L('Серия','Қатарынан'),sBest:L('Рекорд серии','Ең ұзақ қатар'),
  m1L:L('1. Тождество: проверяем подстановкой чисел','1. Тепе-теңдік: сандарды қойып тексереміз'),m1S:L('Как получается правая часть','Оң жақ қалай шығады'),
  m2L:L('2. Сравнение степеней: свойства 6 и 7','2. Дәрежелерді салыстыру: 6 және 7-қасиеттер'),
  m3L:L('3. Освобождение от иррациональности в знаменателе','3. Бөлімдегі иррационалдықтан босату'),
});
function applyUI(){const u=UI();document.querySelectorAll('[data-i]').forEach(e=>{const v=u[e.dataset.i];if(v!==undefined)e.innerHTML=v;});
  document.title=L('Иррациональные выражения','Иррационал өрнектер');
  document.documentElement.lang=LANG==='kz'?'kk':'ru';[...$('#langSw').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));}
const TABS=['theory','model','solve','train','test'];
function showTab(t){TABS.forEach(x=>{$('#p-'+x).hidden=x!==t;$('#t-'+x).setAttribute('aria-selected',x===t);});try{localStorage.setItem('rtx-tab',t);}catch(e){}}

/* ================= графики ================= */
function fplot(svg,o){const{x0,x1,y0,y1,W,H}=o;svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const X=x=>(x-x0)/(x1-x0)*W,Y=y=>(y1-y)/(y1-y0)*H;const sx=o.sx||1,sy=o.sy||1;
  for(let v=Math.ceil(x0/sx)*sx;v<=x1;v+=sx)el('line',{x1:X(v),x2:X(v),y1:0,y2:H,stroke:'var(--line)'},svg);
  for(let v=Math.ceil(y0/sy)*sy;v<=y1;v+=sy)el('line',{x1:0,x2:W,y1:Y(v),y2:Y(v),stroke:'var(--line)'},svg);
  const id='ar'+Math.random().toString(36).slice(2,8);const d=el('defs',{},svg),mk=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:8,markerHeight:8,orient:'auto'},d);el('path',{d:'M0 0L10 5L0 10z',fill:'var(--muted)'},mk);
  el('line',{x1:0,x2:W-2,y1:Y(0),y2:Y(0),stroke:'var(--muted)','stroke-width':2,'marker-end':`url(#${id})`},svg);el('line',{x1:X(0),x2:X(0),y1:H,y2:2,stroke:'var(--muted)','stroke-width':2,'marker-end':`url(#${id})`},svg);
  const lx=o.lx||sx,ly=o.ly||sy;
  for(let v=Math.ceil(x0/lx)*lx;v<=x1-lx*.3;v+=lx){if(Math.abs(v)<1e-9)continue;txt(svg,fmt(v),X(v),Y(0)+22,{'text-anchor':'middle','font-size':16,fill:'var(--muted)'});}
  for(let v=Math.ceil(y0/ly)*ly;v<=y1-ly*.3;v+=ly){if(Math.abs(v)<1e-9)continue;txt(svg,fmt(v),X(0)-8,Y(v)+6,{'text-anchor':'end','font-size':16,fill:'var(--muted)'});}
  txt(svg,'x',W-16,Y(0)-10,{'font-style':'italic',fill:'var(--muted)'});txt(svg,'y',X(0)+10,18,{'font-style':'italic',fill:'var(--muted)'});txt(svg,'0',X(0)-14,Y(0)+20,{'font-size':16,fill:'var(--muted)'});
  const curve=(f,a,b,at)=>{let dd='',on=false;const N=600;for(let i=0;i<=N;i++){const x=a+(b-a)*i/N,y=f(x);if(!isFinite(y)||y>y1+(y1-y0)||y<y0-(y1-y0)){on=false;continue;}dd+=(on?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);on=true;}return el('path',Object.assign({d:dd,fill:'none','stroke-width':3,'stroke-linejoin':'round'},at||{}),svg);};
  return{X,Y,curve,svg};}
const nroot=(x,n)=>x>=0?Math.pow(x,1/n):(n%2?-Math.pow(-x,1/n):NaN);
const COLS=['var(--c1)','var(--c2)','var(--c4)','var(--c3)','#0891b2','#be185d'];
/* ================= РИСУНКИ ================= */
const fig=(id,cap)=>`<figure style="margin:0"><div class="paper-grid"><svg id="${id}" class="plot" role="img" aria-label="${cap.replace(/<[^>]+>/g,'')}"></svg></div><div class="cap">${cap}</div></figure>`;
function figDiff(svg,S,s,lS,ls){svg.innerHTML='';const W=600,Hh=330;svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);
  const pp=l=>/^\d+$/.test(l)?l:`(${l})`;const big=Math.max(S,s),sm=Math.min(S,s);S=big;s=sm;const k=Math.min(440/(2*S+s),220/S);const x0=60,y0=44;
  const R=(x,y,w,h,a)=>el('rect',Object.assign({x,y,width:Math.max(w,0),height:Math.max(h,0)},a),svg);
  const c1={fill:'var(--c1)','fill-opacity':.28,stroke:'var(--c1)','stroke-width':2.5},c2={fill:'var(--c2)','fill-opacity':.28,stroke:'var(--c2)','stroke-width':2.5};
  R(x0,y0,(S-s)*k,s*k,c2);R(x0,y0+s*k,S*k,(S-s)*k,c1);R(x0+(S-s)*k,y0,s*k,s*k,{fill:'none',stroke:'var(--muted)','stroke-width':2,'stroke-dasharray':'6 5'});

const CATN=()=>({pow:L('Дробные показатели','Бөлшек көрсеткіштер'),cmp:L('Сравнение','Салыстыру'),irr:L('Иррациональные выражения','Иррационал өрнектер'),book:L('Учебник','Оқулық'),th:L('Теория','Теория')});

  [L('Пусть 0 &lt; a &lt; 1 и r &gt; s. Какое неравенство верно?','0 &lt; a &lt; 1 және r &gt; s болсын. Қай теңсіздік дұрыс?'),'a<sup>r</sup> &lt; a<sup>s</sup>',['a<sup>r</sup> &gt; a<sup>s</sup>','a<sup>r</sup> = a<sup>s</sup>',L('зависит от r и s','r мен s-ке байланысты')],L('Свойство 7: при 0 &lt; a &lt; 1 большему показателю соответствует меньшая степень.','7-қасиет: 0 &lt; a &lt; 1 болғанда үлкен көрсеткішке кіші дәреже сәйкес.')],

  [L('На что умножить числитель и знаменатель дроби 1/(∛a − ∛b)?','1/(∛a − ∛b) бөлшегінің алымы мен бөлімін неге көбейту керек?'),M_(`${R(3,'a²')} + ${R(3,'ab')} + ${R(3,'b²')}`),[M_(`${R(3,'a')} + ${R(3,'b')}`),M_(`${R(3,'a²')} − ${R(3,'ab')} + ${R(3,'b²')}`),M_(`${R(3,'a²')} + ${R(3,'b²')}`)],L('Неполный квадрат суммы: (∛a − ∛b)(∛a² + ∛ab + ∛b²) = a − b.','Қосындының толымсыз квадраты: (∛a − ∛b)(∛a² + ∛ab + ∛b²) = a − b.')],

const GEN={pow:()=>fromGen('pow',['frac','fact','calcp','frac','fact']),cmp:()=>fromGen('cmp',['cmp']),irr:()=>fromGen('irr',['exp','factr','nest','conjp','rat','rat','simpr']),book:()=>fromGen('book',['book']),th:()=>{const[q,a,w,ex]=pick(THQ());return mkQ('th',q,a,w,ex);}};

function testIntro(){let best=null;try{best=localStorage.getItem('rtx-test');}catch(e){}

    ${best!==null?`<p class="stat">${L('Ваш лучший результат','Ең жақсы нәтижеңіз')}: <b>${best} / 10</b></p>`:''}<button class="btn" id="tStart">${L('Начать тест','Тестті бастау')}</button></div>`;

mq.addEventListener('change',syncTheme);new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

<script>
(function(){
  const cv=document.getElementById('penCv'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const LNG=()=>(typeof LANG!=='undefined'&&LANG==='kz')?1:0;
  const TIP={penMain:['Ручка: рисовать на экране (Esc — выключить)','Қалам: экранға жазу (Esc — өшіру)'],penEr:['Ластик','Өшіргіш'],penLine:['Прямая линия (линейка): потяните от начала к концу','Түзу сызық (сызғыш): басынан соңына дейін тартыңыз'],penCirc:['Окружность (циркуль): нажмите в центре и потяните до нужного радиуса','Шеңбер (циркуль): центрін басып, қажетті радиусқа дейін тартыңыз'],penUndo:['Отменить последнее','Соңғысын болдырмау'],penClr:['Стереть всё на этой вкладке','Осы беттегінің бәрін өшіру'],
    ink:['Чёрный','Қара'],red:['Красный','Қызыл'],blue:['Синий','Көк'],green:['Зелёный','Жасыл'],orange:['Оранжевый','Қызғылт сары'],violet:['Фиолетовый','Күлгін'],w3:['Тонкая линия','Жіңішке сызық'],w6:['Средняя линия','Орташа сызық'],w12:['Толстая линия','Жуан сызық']};
  const COL={ink:['#1c2746','#f1f4fb'],red:['#dc2626','#ff6b6b'],blue:['#2563eb','#7aa2ff'],green:['#15803d','#4ade80'],orange:['#ea580c','#fb923c'],violet:['#7c3aed','#c4a5ff']};
  const mqD=matchMedia('(prefers-color-scheme: dark)');
  const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mqD.matches;};
  const st={on:false,color:'red',w:6,er:false,tool:null,pages:{},cleared:{},cur:null};
  const key=()=>{const t=document.querySelector('[role="tab"][aria-selected="true"]');return t?(t.id||t.dataset.tab||t.textContent):'main';};
  const list=()=>st.pages[key()]||(st.pages[key()]=[]);
  let dpr=1;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);redraw();}
  function stroke(s){if(s.p.length===0)return;ctx.save();ctx.globalCompositeOperation=s.er?'destination-out':'source-over';
    ctx.strokeStyle=s.er?'#000':COL[s.c][dark()?1:0];ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
    const ox=scrollX,oy=scrollY,p=s.p;
    if(s.ci){const r=p.length>1?Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]):0;ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,Math.max(r,1),0,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,Math.max(2,s.w/2),0,7);ctx.fill();
      if(s===st.cur&&p.length>1){ctx.setLineDash([6,6]);ctx.lineWidth=Math.max(1.5,s.w/3);ctx.beginPath();ctx.moveTo(p[0][0]-ox,p[0][1]-oy);ctx.lineTo(p[1][0]-ox,p[1][1]-oy);ctx.stroke();}ctx.restore();return;}
    if(p.length===1){ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,s.w/2,0,7);ctx.fill();}
    else{ctx.beginPath();ctx.moveTo(p[0][0]-ox,p[0][1]-oy);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0]-ox,p[i][1]-oy,mx-ox,my-oy);}

    else if(b.id==='penClr'){if(list().length){st.cleared[key()]=list();st.pages[key()]=[];}redraw();}
    ui();});
  function pt(e){return[e.clientX+scrollX,e.clientY+scrollY];}
  cv.addEventListener('pointerdown',e=>{if(!st.on)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    const er=st.er||e.button===5||(e.buttons&32);
    st.cur={c:st.color,w:er?Math.max(30,st.w*4):st.w,er,ln:st.tool==='line'&&!er,ci:st.tool==='circ'&&!er,p:[pt(e)]};delete st.cleared[key()];redraw();});
  cv.addEventListener('pointermove',e=>{if(!st.cur)return;if(st.cur.ci){st.cur.p=[st.cur.p[0],pt(e)];redraw();return;}if(st.cur.ln){const a=st.cur.p[0];let[b0,b1]=pt(e);const dx=b0-a[0],dy=b1-a[1],L=Math.hypot(dx,dy);if(L>0){const ang=Math.atan2(dy,dx),sn=Math.round(ang/(Math.PI/4))*(Math.PI/4);if(Math.abs(ang-sn)<0.07){b0=a[0]+L*Math.cos(sn);b1=a[1]+L*Math.sin(sn);}}st.cur.p=[a,[b0,b1]];redraw();return;}const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>st.cur.p.push(pt(ev)));redraw();});
  const end=()=>{if(!st.cur)return;list().push(st.cur);st.cur=null;redraw();};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  addEventListener('scroll',redraw,{passive:true});addEventListener('resize',size);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&st.on){st.on=false;ui();}});
  new MutationObserver(()=>{redraw();ui();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','lang']});
  mqD.addEventListener('change',()=>{redraw();ui();});

  document.addEventListener('click',e=>{if(e.target.closest('#langSw,[data-lang]'))setTimeout(tips,0);});
  size();ui();
})();
</script>

<script id="cards-js">
(function(){
  const DATA=window.CARDS_DATA||[];if(!DATA.length)return;
  const lang=()=>(typeof LANG!=='undefined'&&LANG==='kz')?1:0;
  const T=v=>Array.isArray(v)?v[lang()]:v;
  const U=k=>({tab:['Карточки','Карточкалар'],ord:['Порядок','Реттілік'],mat:['Соответствие','Сәйкестік'],

    all:['Всё верно! Молодцы!','Бәрі дұрыс! Жарайсыңдар!'],part:['Верно: ','Дұрыс: '],fill:['Заполните все ячейки.','Барлық ұяшықты толтырыңыз.']}[k][lang()]);
  const $=s=>document.querySelector(s);

  const testTab=nav.querySelector('#t-test');nav.insertBefore(tb,testTab||null);

  const show=on=>{if(on){main.querySelectorAll(':scope > [id^="p-"]').forEach(p=>{if(p!==pane)p.hidden=true;});nav.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b===tb));}pane.hidden=!on;if(!on)tb.setAttribute('aria-selected','false');};
  nav.addEventListener('click',e=>{const b=e.target.closest('[role=tab]');if(!b)return;show(b===tb);});
  let cur=0;const st={};

    pane.querySelector('.ck-top').classList.add('seg');pane.querySelectorAll('[data-ck]').forEach(b=>b.addEventListener('click',()=>{cur=+b.dataset.ck;render();}));draw();}
  function btns(){return `<div class="ck-btns"><button class="btn" data-a="check">${U('check')}</button><button class="btn ghost" data-a="show">${U('show')}</button><button class="btn ghost" data-a="mix">${U('mix')}</button></div><div id="ckFb"></div>`;}
  const item=(html,i,num)=>`<div class="ck-it" data-i="${i}">${num!=null?`<span class="ck-n">${num}</span>`:''}<span>${html}</span><span class="ck-h">⠿</span></div>`;
  function draw(){const d=DATA[cur],s=state(cur),box=$('#ckBox');
    if(d.t==='order'){box.innerHTML=`<h3>${T(d.title)}</h3><p class="ck-hint">${T(d.hint)||U('oh')}</p><div class="ck-list" id="ckL">${s.ord.map((k,j)=>item(T(d.items[k]),k,j+1)).join('')}</div>${btns()}`;}
    else if(d.lay==='h'){box.innerHTML=`<h3>${T(d.title)}</h3><p class="ck-hint">${T(d.hint)||U('mhh')}</p><div class="ck-hgrid">${d.pairs.map((p,k)=>`<div class="ck-col"><div class="ck-term">${T(p[0])}</div><div class="ck-slot" data-s="${k}">${s.slot[k]>=0?item(T(d.pairs[s.slot[k]][1]),s.slot[k]):''}</div></div>`).join('')}</div><div class="ck-pt">${U('pool')}</div><div class="ck-pool h" id="ckP">${s.pool.map(k=>item(T(d.pairs[k][1]),k)).join('')}</div>${btns()}`;}
    else{box.innerHTML=`<h3>${T(d.title)}</h3><p class="ck-hint">${T(d.hint)||U('mh')}</p><div class="ck-mgrid"><div style="display:flex;flex-direction:column;gap:10px">${d.pairs.map((p,k)=>`<div class="ck-row"><div class="ck-term">${T(p[0])}</div><div class="ck-slot" data-s="${k}">${s.slot[k]>=0?item(T(d.pairs[s.slot[k]][1]),s.slot[k]):''}</div></div>`).join('')}</div><div><div class="ck-pt">${U('pool')}</div><div class="ck-pool" id="ckP">${s.pool.map(k=>item(T(d.pairs[k][1]),k)).join('')}</div></div></div>${btns()}`;}
    box.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));bind();}
  function readState(){const d=DATA[cur],s=state(cur);if(d.t==='order'){s.ord=[...$('#ckL').children].map(e=>+e.dataset.i);}else{s.slot=[...pane.querySelectorAll('.ck-slot')].map(sl=>{const c=sl.querySelector('.ck-it');return c?+c.dataset.i:-1;});s.pool=[...$('#ckP').children].map(e=>+e.dataset.i);}}
  function act(a){const d=DATA[cur],s=state(cur),n=d.t==='order'?d.items.length:d.pairs.length;
    if(a==='mix'){delete st[cur];draw();return;}
    if(a==='show'){if(d.t==='order')s.ord=[...Array(n).keys()];else{s.slot=[...Array(n).keys()];s.pool=[];}draw();act('check');return;}
    readState();let ok=0;
    if(d.t==='order'){[...$('#ckL').children].forEach((e,j)=>{const g=+e.dataset.i===j;ok+=g;e.classList.toggle('ok',g);e.classList.toggle('no',!g);e.querySelector('.ck-n').textContent=j+1;});}
    else{if(s.slot.some(v=>v<0)){$('#ckFb').innerHTML=`<div class="ck-fb no">${U('fill')}</div>`;return;}pane.querySelectorAll('.ck-slot').forEach((sl,k)=>{const g=s.slot[k]===k;ok+=g;sl.classList.toggle('ok',g);sl.classList.toggle('no',!g);const c=sl.querySelector('.ck-it');c.classList.toggle('ok',g);c.classList.toggle('no',!g);});}
    $('#ckFb').innerHTML=ok===n?`<div class="ck-fb ok">${U('all')}</div>`:`<div class="ck-fb no">${U('part')}${ok} / ${n}</div>`;}
  function clearMarks(){pane.querySelectorAll('.ok,.no').forEach(e=>e.classList.remove('ok','no'));const f=$('#ckFb');if(f)f.innerHTML='';}
  let sel=null;
  function bind(){sel=null;pane.querySelectorAll('#ckBox .ck-it').forEach(c=>c.addEventListener('pointerdown',down));
    pane.querySelectorAll('.ck-slot,#ckP').forEach(z=>z.addEventListener('click',e=>{if(!sel||e.target.closest('.ck-it'))return;place(sel,z);sel.classList.remove('sel');sel=null;}));}
  function renum(){const l=$('#ckL');if(l)[...l.children].forEach((e,j)=>{const n=e.querySelector('.ck-n');if(n)n.textContent=j+1;});}
  function place(card,zone){const from=card.parentNode;if(zone===from)return;if(zone.classList.contains('ck-slot')){const old=zone.querySelector('.ck-it');if(old&&old!==card){if(from.classList.contains('ck-slot'))from.appendChild(old);else $('#ckP').appendChild(old);}}zone.appendChild(card);clearMarks();readState();}
  function swap(a,b){const pa=a.parentNode,pb=b.parentNode,na=a.nextSibling===b?a:a.nextSibling;pb.insertBefore(a,b);pa.insertBefore(b,na);}
  function down(e){if(e.button>0)return;const card=e.currentTarget;e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;const r=card.getBoundingClientRect();const ox=sx-r.left,oy=sy-r.top;const isOrd=!!card.closest('#ckL');let over=null;
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;
      if(!moved){moved=true;ghost=card.cloneNode(true);ghost.classList.add('ck-ghost');ghost.classList.remove('sel');ghost.style.width=r.width+'px';document.body.appendChild(ghost);card.classList.add('drag');}
      ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';
      if(isOrd){const l=$('#ckL');const sib=[...l.children].filter(x=>x!==card);let ref=null;for(const s of sib){const b=s.getBoundingClientRect();if(ev.clientY<b.top+b.height/2){ref=s;break;}}if(ref!==card.nextSibling)l.insertBefore(card,ref);renum();}
      else{const el=document.elementFromPoint(ev.clientX,ev.clientY);const z=el&&el.closest('.ck-slot,#ckP');if(over&&over!==z)over.classList.remove('ov');over=z;if(z)z.classList.add('ov');}
      const vh=innerHeight;if(ev.clientY<60)scrollBy(0,-12);else if(ev.clientY>vh-60)scrollBy(0,12);};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(ghost)ghost.remove();card.classList.remove('drag');if(over)over.classList.remove('ov');
      if(!moved){ // нажатие: выбрать / поменять местами / поставить
        if(sel&&sel!==card){if(isOrd||sel.closest('#ckL'))swap(sel,card);else{const za=sel.parentNode,zb=card.parentNode;if(za!==zb){zb.classList.contains('ck-slot')?place(sel,zb):place(card,za);}}sel.classList.remove('sel');sel=null;clearMarks();renum();readState();}
        else if(sel===card){card.classList.remove('sel');sel=null;}else{sel=card;card.classList.add('sel');}return;}
      if(isOrd){clearMarks();readState();return;}
      if(over)place(card,over);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);}
  render();
  document.addEventListener('click',e=>{if(e.target.closest('#langSw'))setTimeout(render,0);});
})();
</script>
<!--cards-end-->
